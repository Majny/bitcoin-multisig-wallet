  wallet-registry:
    build:
      context: .
      dockerfile: wallet-registry/Dockerfile
    container_name: wallet_registry
    ports:
      - "8082:8082"
    environment:
      REGISTRY_DB_URL: jdbc:postgresql://postgres:5432/wallet_registry
      REGISTRY_DB_USER: wallet
      REGISTRY_DB_PASSWORD: wallet
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  explorer-service:
    build:
      context: .
      dockerfile: explorer-service/Dockerfile
    container_name: wallet_explorer_service
    ports:
      - "8083:8083"
    environment:
      PORT: "8083"
      REGISTRY_URL: http://wallet-registry:8082
      BLOCKCHAIN_URL: http://blockchain-service:8086
    depends_on:
      - wallet-registry
      - blockchain-service
    restart: unless-stopped

  psbt-service:
    build:
      context: .
      dockerfile: psbt-service/Dockerfile
    container_name: wallet_psbt_service
    ports:
      - "8085:8085"
    environment:
      PORT: "8085"
      DATABASE_URL: jdbc:postgresql://postgres:5432/wallet_psbt
      DATABASE_USER: wallet
      DATABASE_PASSWORD: wallet
      BLOCKCHAIN_SERVICE_URL: http://blockchain-service:8086
      REGISTRY_URL: http://wallet-registry:8082
    depends_on:
      postgres:
        condition: service_healthy
      wallet-registry:
        condition: service_started
      blockchain-service:
        condition: service_started
    restart: unless-stopped

  blockchain-service:
    build:
      context: .
      dockerfile: blockchain-service/Dockerfile
    container_name: wallet_blockchain_service
    ports:
      - "8086:8086"
    environment:
      PORT: "8086"
      MAINNET_MEMPOOL_URL: ${MAINNET_MEMPOOL_URL:-https://blockstream.info/api}
      TESTNET_MEMPOOL_URL: ${TESTNET_MEMPOOL_URL:-https://mempool.space/testnet4/api}
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: unless-stopped

  price-service:
    build:
      context: .
      dockerfile: price-service/Dockerfile
    container_name: wallet_price_service
    ports:
      - "8087:8087"
    environment:
      PORT: "8087"
      COINGECKO_BASE_URL: ${COINGECKO_BASE_URL:-https://api.coingecko.com/api/v3}
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: unless-stopped

volumes:
  wallet_pg_data:
