services:
  postgres:
    image: postgres:16
    container_name: wallet_pg
    environment:
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
      POSTGRES_DB: wallet_registry
    ports:
      - "5432:5432"
    volumes:
      - wallet_pg_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet_registry"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: wallet_api_gateway
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      AUTH_BASE_URL: http://auth-service:8081
      REGISTRY_BASE_URL: http://wallet-registry:8082
      EXPLORER_BASE_URL: http://explorer-service:8083
      PSBT_BASE_URL: http://psbt-service:8085
      BLOCKCHAIN_BASE_URL: http://blockchain-service:8086
      PRICE_BASE_URL: http://price-service:8087
      JWT_ISSUER: wallet-auth
      JWT_AUDIENCE: wallet-gateway
      JWKS_URL: http://auth-service:8081/auth/.well-known/jwks.json
    depends_on:
      - auth-service
      - wallet-registry
      - psbt-service
      - explorer-service
      - blockchain-service
      - price-service
    restart: unless-stopped

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: wallet_auth_service
    ports:
      - "8081:8081"
    environment:
      PORT: "8081"
      JWT_ISSUER: wallet-auth
      JWT_AUDIENCE: wallet-gateway
      JWT_KID: "dev-kid-1"
      # Local dev: auth-service generates an ephemeral RSA key pair at startup (tokens do not
      # survive a restart). For fixed keys set JWT_RSA_PRIVATE_PEM / JWT_RSA_PUBLIC_PEM instead.
      # The RSA key committed here before was for local development only and is no longer accepted.
      JWT_DEV_ALLOW_GENERATE_KEYS: "true"
      AUTH_DB_URL: jdbc:postgresql://postgres:5432/wallet_auth
      AUTH_DB_USER: wallet
      AUTH_DB_PASSWORD: wallet
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  wallet-registry:
    build:
      context: .
      dockerfile: wallet-registry/Dockerfile
    container_name: wallet_registry
    ports:
      - "8082:8082"
    environment:
      REGISTRY_DB_URL: jdbc:postgresql://postgres:5432/wallet_registry
      REGISTRY_DB_USER: wallet
      REGISTRY_DB_PASSWORD: wallet
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  explorer-service:
    build:
      context: .
      dockerfile: explorer-service/Dockerfile
    container_name: wallet_explorer_service
    ports:
      - "8083:8083"
    environment:
      PORT: "8083"
      REGISTRY_URL: http://wallet-registry:8082
      BLOCKCHAIN_URL: http://blockchain-service:8086
    depends_on:
      - wallet-registry
      - blockchain-service
    restart: unless-stopped

  psbt-service:
    build:
      context: .
      dockerfile: psbt-service/Dockerfile
    container_name: wallet_psbt_service
    ports:
      - "8085:8085"
    environment:
      PORT: "8085"
      DATABASE_URL: jdbc:postgresql://postgres:5432/wallet_psbt
      DATABASE_USER: wallet
      DATABASE_PASSWORD: wallet
      BLOCKCHAIN_SERVICE_URL: http://blockchain-service:8086
      REGISTRY_URL: http://wallet-registry:8082
      EXPLORER_SERVICE_URL: http://explorer-service:8083
    depends_on:
      postgres:
        condition: service_healthy
      wallet-registry:
        condition: service_started
      blockchain-service:
        condition: service_started
      explorer-service:
        condition: service_started
    restart: unless-stopped

  blockchain-service:
    build:
      context: .
      dockerfile: blockchain-service/Dockerfile
    container_name: wallet_blockchain_service
    ports:
      - "8086:8086"
    environment:
      PORT: "8086"
      MAINNET_MEMPOOL_URL: ${MAINNET_MEMPOOL_URL:-https://blockstream.info/api}
      TESTNET_MEMPOOL_URL: ${TESTNET_MEMPOOL_URL:-https://mempool.space/testnet4/api}
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: unless-stopped

  price-service:
    build:
      context: .
      dockerfile: price-service/Dockerfile
    container_name: wallet_price_service
    ports:
      - "8087:8087"
    environment:
      PORT: "8087"
      COINGECKO_BASE_URL: ${COINGECKO_BASE_URL:-https://api.coingecko.com/api/v3}
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: unless-stopped

volumes:
  wallet_pg_data:
