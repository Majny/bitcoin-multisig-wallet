services:
  postgres:
    image: postgres:16
    container_name: wallet_pg
    environment:
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
      POSTGRES_DB: wallet_registry
    ports:
      - "5432:5432"
    volumes:
      - wallet_pg_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet_registry"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: wallet_api_gateway
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      AUTH_BASE_URL: http://auth-service:8081
      REGISTRY_BASE_URL: http://wallet-registry:8082
      EXPLORER_BASE_URL: http://explorer-service:8083
      PSBT_BASE_URL: http://psbt-service:8085
      BLOCKCHAIN_BASE_URL: http://blockchain-service:8086
      PRICE_BASE_URL: http://price-service:8087
      JWT_ISSUER: wallet-auth
      JWT_AUDIENCE: wallet-gateway
      JWKS_URL: http://auth-service:8081/auth/.well-known/jwks.json
    depends_on:
      - auth-service
      - wallet-registry
      - psbt-service
      - explorer-service
      - blockchain-service
      - price-service
    restart: unless-stopped

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: wallet_auth_service
    ports:
      - "8081:8081"
